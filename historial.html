<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HEBRASTOCK · Historial de ventas</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="hs-app">
    <div id="hs-sidebar"></div>

    <div>
      <div id="hs-topbar"></div>

      <main class="hs-contenido">
        <div class="hs-panel">
          <h2 class="hs-panel-titulo">Historial de ventas</h2>

          <div class="hs-toolbar">
            <label style="font-size:13px; color:var(--gris-600);">Desde:
              <input type="date" id="filtro-desde" />
            </label>
            <label style="font-size:13px; color:var(--gris-600);">Hasta:
              <input type="date" id="filtro-hasta" />
            </label>
            <button class="hs-btn hs-btn-secundario hs-btn-chico" onclick="limpiarFiltrosHistorial()">Limpiar</button>
            <div class="hs-spacer"></div>
            <div style="font-size:13.5px; color:var(--gris-600);">
              Total del periodo: <strong id="historial-total">$0</strong>
            </div>
          </div>

          <div class="hs-tabla-wrap">
            <table class="hs-tabla">
              <thead>
                <tr>
                  <th>Fecha</th>
                  <th>Productos vendidos</th>
                  <th>Total</th>
                </tr>
              </thead>
              <tbody id="tabla-historial"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/historial.js"></script>
</body>
</html>

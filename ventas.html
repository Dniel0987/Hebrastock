<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HEBRASTOCK · Registrar venta</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="hs-app">
    <div id="hs-sidebar"></div>

    <div>
      <div id="hs-topbar"></div>

      <main class="hs-contenido">
        <div class="hs-grid-2">
          <div class="hs-panel">
            <h2 class="hs-panel-titulo">Agregar producto a la venta</h2>

            <div class="hs-campo">
              <label for="v-producto">Producto</label>
              <select id="v-producto"></select>
            </div>

            <div class="hs-form-fila">
              <div class="hs-campo">
                <label for="v-cantidad">Cantidad</label>
                <input type="number" id="v-cantidad" min="1" value="1" />
              </div>
              <div class="hs-campo">
                <label>Disponible</label>
                <input type="text" id="v-disponible" disabled />
              </div>
            </div>

            <button class="hs-btn hs-btn-primario" onclick="agregarAlCarrito()">Agregar al carrito</button>
          </div>

          <div class="hs-panel">
            <h2 class="hs-panel-titulo">Venta actual</h2>
            <div id="carrito-lista">
              <p class="hs-tabla-vacia">Todavía no has agregado productos.</p>
            </div>
            <div class="hs-carrito-total">
              <span>Total</span>
              <span id="carrito-total">$0</span>
            </div>
            <div style="margin-top:16px; display:flex; gap:10px;">
              <button class="hs-btn hs-btn-secundario" onclick="vaciarCarrito()">Vaciar</button>
              <button class="hs-btn hs-btn-primario" style="flex:1" onclick="confirmarVenta()">Confirmar venta</button>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/ventas.js"></script>
</body>
</html>
